name: T9 bundled TypeScript agent

on:
  push:
    branches: [bun-refactor]
    paths:
      - "plugins/agents/iyon/**"
      - "packages/iyon-runtime/test/agent-registration.integration.test.ts"
      - "packages/iyon-runtime/test/custom-agent.integration.test.ts"
      - "packages/iyon-runtime/test/subagent.integration.test.ts"
      - "packages/iyon-runtime/test/fixtures/**"
      - "packages/iyon-plugins/src/contributions.ts"
      - ".github/workflows/ts-agent.yml"
  pull_request:
    paths:
      - "plugins/agents/iyon/**"
      - "packages/iyon-runtime/test/agent-registration.integration.test.ts"
      - "packages/iyon-runtime/test/custom-agent.integration.test.ts"
      - "packages/iyon-runtime/test/subagent.integration.test.ts"
      - "packages/iyon-runtime/test/fixtures/**"
      - "packages/iyon-plugins/src/contributions.ts"
      - ".github/workflows/ts-agent.yml"

jobs:
  t9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: bun install --frozen-lockfile
      - run: bun run native:stage
      - run: bunx tsc -p plugins/agents/iyon/tsconfig.json --noEmit
      - run: bunx tsc --noEmit
      - run: bun test packages/iyon-runtime/test/custom-agent.integration.test.ts packages/iyon-runtime/test/subagent.integration.test.ts plugins/agents/iyon/test/public-boundary.test.ts
      - run: cargo check --workspace
      - run: git diff --check
