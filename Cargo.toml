[workspace]
members = ["crates/iyon", "crates/iyon-core", "crates/iyon-api", "crates/iyon-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
secrecy = "0.10.3"
keyring = "3.6.3"
rpassword = "7.4.0"
base64 = "0.22.1"
tokio-util = "0.7.17"
toml = "1.1.2"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"

iyon-api = {path = "crates/iyon-api"}
iyon-core = {path = "crates/iyon-core"}
iyon-tui = {path = "crates/iyon-tui"}
